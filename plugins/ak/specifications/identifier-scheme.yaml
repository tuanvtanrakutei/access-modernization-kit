# Stable identifiers for what the investigation discovers.
#
# Evidence IDs answer "where did this come from". They are not enough. A rule
# found in Phase 3 has to be citable by Phase 4, consolidated by Phase 6, and
# checked for coverage by the modernization pipeline - and none of that is
# possible if the rule has no name.
#
# The kit's phase templates carried bare "Rule ID" and "Workflow ID" columns with
# no scheme behind them, so Phase 6's actual job - consolidation - had nothing to
# consolidate. This file registers the vocabularies the reference document set
# uses, and the rules that keep them trustworthy.

version: "2.9"

# ---------------------------------------------------------------------------
# How identifiers are written and stored.
# ---------------------------------------------------------------------------
conventions:
  in_prose: >
    Bare, as the reference set writes them: `BR-ORD-06`, `WF-003`, `RD-01`. The
    app is implied by the document.
  in_registers: >
    App-scoped: `A99::BR-ORD-06`. Two apps' registers can be merged without a
    collision, and an identifier can never be read as belonging to the wrong app.
  allocation: >
    Sequential within a namespace, allocated by the phase that discovers the item,
    starting at 01. Numbers are never reused and never renumbered - a published
    identifier is a permanent address.
  supersession: >
    A finding that turns out wrong is not renumbered or deleted. It keeps its
    identifier and gains an errata entry that supersedes it. See errata-contract.yaml.

# ---------------------------------------------------------------------------
# The vocabularies.
# ---------------------------------------------------------------------------
namespaces:

  BR:
    name: "Business rule"
    # Two forms, both in the reference set. A rule that belongs to a business domain
    # is scoped by that domain; a rule that exists only as a step of one workflow is
    # scoped by the workflow, which is how the reference set's Phase 4 writes every
    # rule it allocates. A single-letter domain is not permitted: BR-M01 and BR-D02
    # gave one namespace two meanings, and nothing said which.
    pattern: "^BR-(?:[A-Z]{2,6}|W[0-9]{3})-[0-9]{2}$"
    example: "BR-ORD-06"
    example_workflow_scoped: "BR-W001-03"
    owned_by: [phase3, phase4, phase5]
    consolidated_by: phase6
    requires_evidence: true
    domains:
      AUTH: "Authentication and session"
      ORD: "Order import, conversion and entry"
      MOD: "Modification and cancellation"
      PRICE: "Pricing"
      SLIP: "Slip and document numbering"
      DEL: "Delivery and logistics"
      INV: "Inventory and stock"
      RET: "Sales returns"
      PUR: "Purchasing and receiving"
      WGT: "Weight-based and measured quantities"
      NET: "Downstream synchronisation"
      BE: "Secondary channel"
      EXT: "External sales"
      INT: "Internal sales"
      TRF: "Transfers"
      EXC: "Exceptional movements"
      MST: "Master data editing and period control"
      SPL: "Special orders"
      RPT: "Reporting and output"
      MON: "Monthly close, cross-cutting dependencies"
      DOC: "Rule stated by a document rather than observed in code"
    note: >
      Domains are extended per application, not invented per rule. A rule that
      fits no domain is a sign the domain list needs one entry, not that the rule
      should be filed under a near miss. The reference set writes two of these
      without a separating dash - BR-M01, BR-D02 - beside the dashed BR-ORD-06.
      One namespace with two shapes cannot be checked and has to be memorised, so
      those two are MON and DOC here and take the same form as every other domain.
    workflow_local_form:
      pattern: "^BR-W[0-9]{3}-[0-9]{2}$"
      example: "BR-W003-01"
      means: "A rule that only holds inside one workflow. Promote to a BR-{DOMAIN} form if it turns out to be general."

  WF:
    name: "End-to-end workflow"
    pattern: "^WF-[0-9]{3}[a-z]?$"
    example: "WF-008b"
    owned_by: [phase4]
    requires_evidence: true
    requires:
      - "one sequence or flow diagram"
      - "at least one BR- rule"
      - "traceability rows covering every step"
    note: "The lowercase suffix marks a variant that shares a trigger with its base workflow."

  F:
    name: "Screen, form or report"
    pattern: "^F-[0-9]{3}$"
    example: "F-003"
    owned_by: [phase2]
    requires_evidence: true
    always_paired_with_object_name: true
    note: >
      An index, not an identifier. For an application whose objects are named in
      Japanese, `F-014` tells a reader nothing on its own, so the object's real
      name is written beside it everywhere it appears, and every downstream key -
      registry rows, file names, module keys - uses the object name rather than the
      index. This closes the `screen_S001` defect on the modernization side, where
      a generated key carried no meaning back to the operator.

  OB:
    name: "Technical observation"
    pattern: "^OB-[0-9]{2}$"
    example: "OB-05"
    owned_by: [phase1, phase2, phase3, phase4, phase5]
    requires_evidence: true
    note: >
      A property of the system worth carrying forward that is not yet a rule or a risk.
      Every analysis phase produces these; the namespace carried phase1 alone until
      2026-09-14, when the first checker to read `owned_by` found Phase 2 holding eight
      of them. Unlike RS, nothing about an observation is phase-specific, so the narrow
      ownership was an oversight rather than a design - widening it invalidates no
      allocation already made.

  RD:
    name: "Risk - data and integrity"
    pattern: "^RD-[0-9]{2}$"
    owned_by: [phase1, phase6]
    requires_evidence: true
    requires_severity: true
  RA:
    name: "Risk - application layer"
    pattern: "^RA-[0-9]{2}$"
    owned_by: [phase2, phase3, phase6]
    requires_evidence: true
    requires_severity: true
    note: >
      Phase 2 owns this as well as Phase 3. A screen is application layer, and until
      2026-09-14 no risk namespace was owned by Phase 2 at all - so one Phase 2 put
      five screen risks into RS, whose letter reads as Screen and whose name is
      "security and compliance". One of them was "grouping carried by 222 line and
      rectangle controls", which is not a security finding, and the numbers RS-01..05
      were taken before Phase 5 could allocate a real one.
  RW:
    name: "Risk - workflow and operations"
    pattern: "^RW-[0-9]{2}$"
    owned_by: [phase4, phase6]
    requires_evidence: true
    requires_severity: true
  RS:
    name: "Risk - security and compliance"
    pattern: "^RS-[0-9]{2}$"
    owned_by: [phase5, phase6]
    requires_evidence: true
    requires_severity: true
    note: >
      The S is Security, not Screen. A screen-layer risk is RA.

  DISC:
    name: "Document-versus-code discrepancy"
    pattern: "^DISC-[0-9]{2}$"
    example: "DISC-05"
    owned_by: [phase5]
    requires_evidence: true
    requires:
      - "the document's claim, cited"
      - "the observed code or data behaviour, cited"
      - "a severity"
    note: "Required by rule EC-04. Neither side is silently preferred."

  UK:
    name: "Unknown carried forward"
    pattern: "^UK-[DSPWL][0-9]{2}$"
    example: "UK-D03"
    owned_by: [phase1, phase2, phase3, phase4, phase5]
    requires_evidence: false
    letters:
      D: "Data - raised in Phase 1"
      S: "Screens - raised in Phase 2"
      L: "Logic - raised in Phase 3"
      W: "Workflow - raised in Phase 4"
      P: "Documents - raised in Phase 5"
    requires:
      - "why it matters"
      - "what would settle it, named as an evidence class"
      - "who can settle it"
    note: >
      An unknown states the evidence class that would close it, so the operator is
      told what to fetch rather than that something is missing.

  AS:
    name: "Assumption carried forward"
    pattern: "^AS-[0-9]{2}$"
    example: "AS-07"
    owned_by: [phase1, phase2, phase3, phase4, phase5, phase6]
    requires_evidence: false
    requires:
      - "what breaks if it is wrong, in the register's `if_wrong` as well as the phase's table (ID-12)"

  E:
    name: "Errata entry"
    pattern: "^E-[0-9]{2}$"
    example: "E-01"
    # A67. Phase 6 was to render the register; it is not the only phase allowed to write to
    # it. ER-06 already says an entry may correct a claim in any phase, and a
    # correction found in Phase 3 cannot wait for Phase 6 - by then the wrong claim
    # has been published for the length of three more phases, and anyone rebuilding
    # from it has already acted. One Phase 3 corrected two Phase 1 risks and could
    # allocate nothing, so it wrote the correction into prose and the register stayed
    # empty. Phase 1 is excluded because there is nothing published before it.
    owned_by: [phase2, phase3, phase4, phase5, phase6]
    # A77. The phases cite an entry as soon as it is written, so the page cannot wait for
    # Phase 6 either: `$ak errata` renders `{APP_ID}_Errata.md` from the register.
    rendered_by: "$ak errata"
    requires_evidence: true
    note: "Governed by errata-contract.yaml."

  Q:
    name: "Open question to a stakeholder"
    pattern: "^Q[0-9]{1,3}$"
    example: "Q12"
    owned_by: [phase1, phase2, phase3, phase4, phase5]
    requires_evidence: false
    note: >
      The ask. When answered, the answer becomes INTERVIEW-class evidence with its own
      evidence ID, and the question is marked resolved against it - the two are never
      the same record. An open Q carries a `needs` block (see `register.needs`), which
      is what makes it routable: who can answer, what waits on it, what the pipeline
      proceeds on meanwhile. A Q asks about a `UK-` through `needs.gap`; the unknown is
      the gap in the document and the question is the action, so a pair is two records
      doing two jobs and not a duplicate.

  d:
    name: "Inbound data file crossing the boundary"
    pattern: "^d[0-9]{2}$"
    example: "d05"
    owned_by: [phase5]
    requires_evidence: true
    requires: ["name", "format", "source system", "path", "cadence"]

  r:
    name: "Outbound file, report or export"
    pattern: "^r[0-9]{2}$"
    example: "r19"
    owned_by: [phase5]
    requires_evidence: true
    requires: ["name", "format", "destination", "path", "cadence"]

# ---------------------------------------------------------------------------
# Rules the conformance checker enforces.
# ---------------------------------------------------------------------------
rules:

  - id: ID-01
    rule: "Every allocated identifier in a namespace marked `requires_evidence` cites at least one evidence ID."
    on_violation: "The phase fails conformance; the identifier is unsupported."

  - id: ID-02
    rule: "Every identifier cited by a document resolves to an allocation in the register."
    on_violation: "A dangling identifier - the same defect class as a dangling evidence citation."

  - id: ID-03
    rule: "An identifier is allocated once and never renumbered, reused or deleted."
    on_violation: "Two documents disagree about what an address means."

  - id: ID-04
    rule: >
      Phase 6 consolidates rather than re-derives: every BR-, RD-, RA-, RW-, RS-,
      UK- and AS- in Phase 6 must already exist in a prior phase, or be an E- entry
      explaining why it is new.
    on_violation: "Phase 6 has invented a finding rather than synthesised one."

  - id: ID-05
    rule: "A risk carries a severity from the declared set, and a mitigation or an explicit 'none proposed'."
    severities: ["HIGH", "MEDIUM", "LOW"]

  - id: ID-06
    rule: "Every F- appears with the object's real name beside it, in every document and every generated key."
    on_violation: "A reader cannot tell which screen is meant."

  # A75. The next four govern the `needs` block. They exist because a person was asked in
  # ten places and the register knew none of it: the fields were prose in four tables.
  - id: ID-07
    rule: >
      Every open `Q` carries a `needs` block, and every open `UK-` either carries one or
      is named by a `Q`'s `needs.gap`.
    on_violation: "A question exists that no queue can route, rank or block on."

  - id: ID-08
    rule: >
      `needs.party` is a canonical party in `input/decisions/parties.yaml`, as are every
      `needs.also` and the party each `needs.named` person is listed under. A DISPOSITION,
      SCOPE or POLICY belongs to the `decider`.
    on_violation: "An owner nobody can be sent to. One department under two spellings is two agendas."

  - id: ID-09
    rule: >
      Every identifier a `needs` block names resolves in the register. `default` is an
      `AS-` (or `mitigation` on a risk's DISPOSITION), `gap` is a `UK-` and appears only on
      a `Q`, `blocks` is not empty unless the kind is POLICY or the item is a risk's
      DISPOSITION proceeding on its own Mitigation, `depends_on` has no cycle, a
      DISPOSITION's `options` are among the dispositions below, and no field outside the
      declared ones is present.
    on_violation: "A reference that points nowhere, an agenda that cannot be ordered, or a misspelt field that does nothing while looking like one that works."

  - id: ID-10
    rule: >
      A phase's own Questions and Unknowns tables agree with the register on party, blocks,
      default and whether an item is closed. A cell that is prose, naming nothing a program
      can follow, is counted and not compared.
    on_violation: "The document and the register describe two different questions; a reader acts on one and the queue on the other."

  # A75 slice 3. A risk's Mitigation is a recommended answer for a legacy defect, and nobody
  # was asked to accept any of one run's 25.
  - id: ID-11
    rule: >
      Every open risk (`RD-`, `RA-`, `RW-`, `RS-`) carries a `needs` block of kind
      DISPOSITION, owned by the `decider`, with a `class`. It proceeds on `mitigation`, the
      risk's own Mitigation, unless the row proposes none, and it `depends_on` the open
      questions that Mitigation waits on. A rule in `input/decisions/policy.yaml` that names
      who decided it and when settles every open disposition of its class unless it says
      `ask`, and every item it settles is still listed, as settled by it.
    on_violation: "A recommendation nobody is asked to accept, and that no standing policy can reach."

  # A75, errata slice. A question with a default proceeds on an assumption; its answer either
  # held that assumption or broke it, and the register used to record the answer and leave the
  # assumption standing. "If wrong" was a prose column, so the list of what to refresh was
  # assembled by a person reading three documents (one run's E-01 and E-02).
  - id: ID-12
    rule: >
      Every open `AS-` carries `if_wrong` in the register: the sentence its phase wrote in the
      Assumptions table's "If wrong" column, saying what stops holding if the assumption is
      wrong. The identifiers it names are the assumption's refresh set.
    on_violation: "An answer that contradicts the assumption cannot say what to refresh."

  - id: ID-13
    rule: >
      When every item whose `needs.default` is an assumption is closed and at least one was
      answered, the assumption is settled: `resolved_by` names the evidence that confirms it,
      or `superseded_by` names the `E-` entry that corrects it. That entry's `affected` names
      every identifier in the assumption's `if_wrong`. An item closed only by `superseded_by`
      was a duplicate and answers nothing.
    on_violation: "A published claim stays in force after the evidence that ended it, and the correction does not reach everything built on it."
    checked_by: "validate_phase_conformance.py, check `decision_fields_present`"

# ---------------------------------------------------------------------------
# Where allocations live.
# ---------------------------------------------------------------------------
register:
  path: "runs/{RUN_ID}/outputs/{APP_ID}_Identifiers.json"
  written_by: "the phase that allocates, appended never rewritten"
  fields: ["id", "namespace", "phase", "title", "evidence_ids", "severity", "superseded_by", "resolved_by", "created_at", "needs", "if_wrong"]
  closing: >
    An open `UK-` or `Q` is carried by every later phase until one of two fields is
    set. `resolved_by` names the evidence id that answers it - the question is done,
    and the answer is in the phase that found it. `superseded_by` names another
    identifier that asks the same thing, which is how a duplicate stops being carried
    twice: one run allocated `Q108` asking what `Q103` already asked of the same owner
    about the same file, because Phase 2 never re-read Phase 1's questions.

    Neither field is a way to make a list shorter. An item with nothing in this phase
    bearing on it stays open and is reported as unchanged.

  # A75. What makes an entry a queue item, and what the queue may read from it. The module
  # `contracts/decision_queue.py` holds the validator; `schemas/decision-needs.schema.json`
  # holds the same structure for tools that do not import it; a test holds the three
  # together, because a contract stated in two places drifts in one of them (A74).
  needs:
    purpose: >
      An entry is a queue item if and only if it carries a `needs` block. The block holds
      the fields a person routing the question needs and a program cannot recover from a
      table cell: who can answer, what waits on it, and what the pipeline does meanwhile.
      Status is not one of them. It is derived from `resolved_by` and `superseded_by`.
    kinds:
      FACT: "What the legacy system does, means, or who uses it. Settled by INTERVIEW or DOCUMENT evidence (EC-01)."
      DISPOSITION: "What the new system does about a legacy behaviour: preserve, fix, drop or defer. Settled by TARGET_INTENT."
      SCOPE: "Whether a screen, report, table or boundary file is in the replacement. Settled by TARGET_INTENT (EC-07)."
      POLICY: "A rule that settles a class of the others. Settled by TARGET_INTENT."
    risk_classes: ["technical", "data", "retired", "behaviour"]
    # What the new system does about a legacy behaviour. `fix` is doing what the risk's own
    # Mitigation says. One closed list, because a disposition becomes a gap-matrix row
    # (`planned` for preserve, `accepted-difference` for fix or drop).
    dispositions: ["fix", "preserve", "drop", "defer"]
    fields:
      kind: "One of the kinds above. Required."
      party: "Canonical name in input/decisions/parties.yaml. Required. The `decider` for every kind but FACT."
      also: "Other canonical parties who can answer. Optional."
      named: "People inside the party who can answer, each listed under a party in parties.yaml. Optional."
      blocks: "Identifiers, or `object:<production name>`, that cannot be finalised without it. Required and non-empty except for a POLICY."
      default: "The AS- the pipeline proceeds on while the item is open, or `mitigation` for a risk's DISPOSITION. Absent means the item blocks what it names."
      gap: "The UK- this question asks about. A Q only."
      depends_on: "Items to settle first. No cycles."
      class: "Risks only: technical, data, retired or behaviour, the key into standing policy."
      options: "DISPOSITION and SCOPE: the choices, at least two."
      qa: "The customer's Q&A register ids this item was posted as, once a person has posted it (`$ak decisions --link`). Read by `$ak decisions` to tell what is already with the customer. Optional."
    if_wrong:
      what: >
        A field of the entry, not of its `needs` block: an assumption is not a queue item, it is
        what an item proceeds on. The text is copied from the "If wrong" cell of the phase that
        allocated the assumption (`$ak backfill-needs` proposes it; a phase writes it directly
        from then on). `$ak decisions` prints it under each item that proceeds on the
        assumption, with the identifiers it names as the refresh set.
      contradiction: >
        A contradicting answer is an errata entry (`errata-contract.yaml`). The assumption is
        `superseded_by` that entry, and the entry's `affected` names the refresh set. Writing
        the entry stays with the phase that found the error (A67); the check refuses a
        correction that leaves out something the assumption said would stop holding.
    answered_by: >
      A DISPOSITION is answered by the decider, in a batch (`$ak decisions --decide`): each
      answer is a row of a TARGET_INTENT record in `input/target-intent/` naming who decided
      and when, and an evidence item citing that row, whose statement opens
      `Disposition of <id>: <choice>.`; `resolved_by` then names the evidence. The answer is
      never written into the `needs` block.

  # A75 slice 3. Rules asked once. The module `contracts/decision_queue.py` (`Policy`) holds
  # the validator, and a test holds these lists to it.
  policy:
    path: "input/decisions/policy.yaml"
    written_by: "`$ak backfill-needs` proposes it; the decider edits it"
    fields: ["id", "class", "disposition", "decided_by", "decided_on", "note"]
    dispositions: ["fix", "preserve", "drop", "defer", "ask"]
    in_force: >
      A rule settles nothing until it names `decided_by` and `decided_on`, as every
      target-intent record names both. One class has one rule. A rule saying `ask` puts
      each item of its class to the decider, with its Mitigation as the default, and a
      `fix` rule passes over a risk whose row proposed no Mitigation, there being nothing
      to do. A file with any problem settles nothing, rather than settling by whichever
      half parsed.
