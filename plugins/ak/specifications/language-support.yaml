version: "2.1"
human_languages:
  supported: ["EN", "JA", "VI", "OTHER", "UNKNOWN"]
  output_languages: ["EN", "JA", "VI"]
  # A49. `validate_phase_conformance` asked whether a document states its naming
  # convention and its source coverage by looking for English substrings, so a
  # conformant Vietnamese document failed both - and the failure text said it lacked a
  # section it contained. The kit offers three output languages; its gate read one.
  #
  # A section is matched if ANY of its language's phrases appears. The phrases are not
  # a template: a document may word the section however it likes, and this lists the
  # terms a writer in that language would have to use to be talking about the subject
  # at all. Add a language here and the gate covers it.
  conformance_signals:
    naming_convention:
      EN: ["naming convention", "production name", "romaji", "never translate"]
      # `命名規約` and `命名規則` are both current; the reference set writes 規約, and a
      # narrower list failed the gold standard, which is the contract being wrong
      # rather than the document.
      JA: ["命名規約", "命名規則", "本来のテーブル名", "本番名", "日本語名", "romaji", "ローマ字"]
      VI: ["quy ước đặt tên", "tên production", "tên gốc", "không dịch tên"]
    source_coverage:
      EN: ["source coverage", "evidence class"]
      JA: ["ソースカバレッジ", "証拠クラス", "根拠の網羅"]
      VI: ["mức độ bao phủ nguồn", "bao phủ nguồn", "lớp bằng chứng"]
    # A67. What a document says when it has corrected an earlier phase's published
    # claim. A06's Phase 3 wrote `**corrected**` in its carried-forward table and
    # `**đã sửa**` in the Vietnamese, and registered no errata entry for either.
    # These are deliberately narrow: `corrects` alone would fire on any sentence
    # about a correction the document is only describing.
    correction:
      EN: ["**corrected**", "this phase corrects", "supersedes the published"]
      JA: ["**訂正**", "本フェーズで訂正", "既刊の記述を訂正"]
      VI: ["**đã sửa**", "phase này sửa lại", "thay thế phát biểu đã publish"]
source_languages:
  full_evidence_trace:
    - "ACCESS_VBA"
    - "EXCEL_VBA"
    - "ACCESS_SQL"
    - "TSQL"
    - "ODBC_PASS_THROUGH_SQL"
  structural_and_semantic:
    - "VBSCRIPT"
    - "POWERSHELL"
    - "BATCH"
  optional_structural:
    - "C"
    - "CPP"
    - "CSHARP"
    - "JAVA"
    - "JAVASCRIPT"
    - "TYPESCRIPT"
    - "PYTHON"
  extract_first:
    - "ACCESS_MDB"
    - "ACCESS_ACCDB"
    - "ACCESS_ADP"
dialects:
  sql: ["ACCESS_SQL", "TSQL", "ODBC_PASS_THROUGH_SQL", "ANSI_SQL", "UNKNOWN"]
  vba: ["ACCESS_VBA", "EXCEL_VBA", "VB6_COMPATIBLE", "UNKNOWN"]
encodings:
  supported: ["UTF-8", "UTF-8-BOM", "UTF-16LE", "UTF-16BE", "CP932", "SHIFT_JIS", "WINDOWS-1252", "BINARY", "UNKNOWN"]
fact_derivation:
  rule: "Derive from extracted text and the sealed bundle, never directly from Access database binaries."
  vba_caveat: "Derivation matches names the sources state literally; it does not parse VBA. Every derived edge stays traceable to the line that produced it."
