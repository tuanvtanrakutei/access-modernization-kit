version: "1.0"

# One layout, two ways to fill it. Runtime extraction and the shipped VBA exporter
# must write the same container names and the same formats, so evidence produced on
# a machine that has Access is interchangeable with evidence extracted here. Where
# the two disagreed, field and index detail reached the bundle from one route only,
# which silently made Phase 1 depend on runtime access.
#
# Consumers: scripts/extract_access.ps1, tools/ExportAccessObjects.bas,
# scripts/build_import_manifest.py, adapters/imported_sources/adapter.py.

containers:
  forms:
    kind: form
    role: frontend
    format: access-saveastext
    extension: .txt
    encoding: utf-8
    description: One file per form, as Access SaveAsText writes it.
  reports:
    kind: report
    role: frontend
    format: access-saveastext
    extension: .txt
    encoding: utf-8
    description: One file per report.
  macros:
    kind: macro
    role: frontend
    format: access-saveastext
    extension: .txt
    encoding: utf-8
    description: One file per macro.
  vba:
    kind: vba
    role: frontend
    format: access-saveastext
    extension: .txt
    encoding: utf-8
    description: One file per standalone module. Form and report code-behind travels
      inside that object's own file, not here.
  queries:
    kind: access_sql
    role: backend
    format: sql-text
    extension: .sql
    encoding: utf-8
    description: One file per saved query, the QueryDef SQL verbatim.
  documents:
    kind: document
    role: documentation
    description: Business documents. No runtime route exists; a person supplies these.
  screenshots:
    kind: screenshot
    role: interface
    description: Captured screens. No runtime route exists.
  samples:
    kind: sample
    role: interface
    description: Sample input files the application reads.
  reports-out:
    kind: report_output
    role: interface
    description: Sample outputs the application produces - printed reports, exports.

# Container names other producers use for the same thing. Declared rather than
# quietly accepted, so it is visible which tool a layout belongs to. msaccess-vcs
# writes modules/ where this kit's exporter writes vba/; dropping the alias made a
# perfectly good msaccess-vcs export fail to classify.
container_aliases:
  modules: vba

# Structured schema detail. tables.json is the contract for BOTH routes: it is the
# only shape carrying fields and indexes, and therefore the only one that can yield
# field_inventory and key_index_inventory.
schema_files:
  tables:
    path: schema/tables.json
    format: json
    required: true
    supplies: [access_schema_inventory, field_inventory, key_index_inventory, boundary_inventory]
    record:
      name: string
      source_table_name: string
      connect: string
      attributes: integer
      fields: "[{name, type, size, required}]"
      indexes: "[{name, primary, unique, fields[]}]"
      read_error: string
  relations:
    path: schema/relations.json
    format: json
    required: false
    supplies: [declared_relationship_inventory]

# Legacy shape. Accepted so an export made before tables.json existed still imports,
# but it carries no field or index detail, so it cannot supply what Phase 1 needs.
deprecated_schema_files:
  tables_text:
    path: schema/tables.txt
    format: text
    supplies: []
    warning: >-
      schema/tables.txt carries no field or index detail, so field_inventory and
      key_index_inventory cannot be derived from it. Re-export with a version of
      ExportAccessObjects.bas that writes schema/tables.json.

package_files:
  producer_manifest:
    path: import-source-manifest.yaml
    generated_by: scripts/build_import_manifest.py
    required: true
    description: Declares every member so a truncated or altered package is refused
      rather than imported as complete.
  export_summary:
    path: export-manifest.txt
    kind: metadata
    required: false
    description: Object counts and skipped objects, written by the VBA exporter at the
      package root. Recognized by name; it is not a misfiled member.

# The workspace directories, declared here so init creates exactly what the pipeline
# uses. Three duplicated pairs had grown up: a top-level outputs/ beside every run's
# own outputs/, a top-level evidence/evidence.json nothing ever read, and
# extracted/access/ from before acquisition wrote acquired/staging/. Each was created
# on every init and each gave an operator a second plausible place to look.
workspace:
  inputs:
    sources/access:
      purpose: Access databases - .mdb, .accdb, .adp. The only binaries a human places.
    sources/documents:
      purpose: Business documents. Supplies document_inventory, which no runtime route can.
    sources/screenshots:
      purpose: Captured screens. No runtime route produces these.
    sources/samples:
      purpose: Sample input files the application reads, for the inbound boundary.
    sources/reports-out:
      purpose: Sample outputs the application produces, for the outbound boundary.
    sources/<ARTIFACT_ID>:
      purpose: >-
        One imported export package per artifact, holding the containers declared
        above - forms/, reports/, macros/, vba/, queries/, schema/ - plus its
        import-source-manifest.yaml. Created by whoever supplies the export, not by init.
    shared-docs:
      purpose: Documents shared across the application estate rather than owned by this app.
  machine_written:
    # One rule, and it is the whole of it: evidence moves left to right, and each
    # step has exactly one home. Snapshots are disposable, staging is what was read
    # out, a bundle is what was sealed, extracted/ is what was derived from a bundle.
    # Before 2.9.0 the same question - "where is the extracted text" - had three
    # plausible answers and no rule to choose between them.
    acquired/snapshots/<acquisition-id>:
      purpose: >-
        Disposable copies of the declared databases. They exist because the original
        must never be opened - opening mutates it - and they are removed once
        extraction has written its receipt, since nothing reads them afterwards. On a
        real split application they were 615 MB beside 587 MB of originals.
      lifetime: Deleted after a VALID run. Kept on PARTIAL or BLOCKED, and by --keep-snapshots.
      warning: Never cite one. The digest in the receipt is what proves what was read.
    acquired/staging/<database-id>/<acquisition-id>:
      purpose: What extraction read out of one artifact - definition text, schema, queries, and its receipt.
      warning: Never hand-edited. Immutable once written; this is the evidence.
    acquired/bundles/<date>-<digest>:
      purpose: >-
        A sealed, canonical view assembled from staging, and what every later phase
        reads. The directory is named for a person; the full SHA-256 bundle_id stays
        inside bundle.json, where it is the content address it was always meant to be.
      note: >-
        Workspaces written before 2.9.0 carry acquired/bundle-<64 hex> instead. Both
        are read, so upgrading the kit does not strand a run in progress.
    extracted:
      purpose: >-
        Everything derived from the bundle - component-index.json, module-plan/,
        derived-extraction.json, the distilled ui-facts, and documents/ holding
        XLSX, DOCX, PPTX and PDF sources normalized to citable UTF-8 with a
        provenance header. Regenerable; a phase cites it because re-running the
        derivation reproduces it exactly.
    runs/<run-id>:
      purpose: >-
        One investigation run. Phase documents, evidence register and traceability
        matrix live in its outputs/ - there is no second copy at the workspace root.
  human_written:
    decisions:
      purpose: Decisions a person made that the sources cannot state.
