# Terms deliberately absent, so a gap is a decision rather than an oversight.
not_translated:
  - reason: >-
      A name that is only a single kana or symbol carries no term. Composition leaves
      it as-is and marks the name partial, because guessing at it would be worse than
      saying it is unresolved.
