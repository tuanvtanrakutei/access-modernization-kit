# Japanese business terms and the English name each one gets.
#
# Why a dictionary rather than a translator. 328 A05 column names collapse to 137
# once a trailing index is stripped (`店舗コード1` … `店舗コード21` are one term and
# a position), and 118 table names collapse to 105 - and both are built from the same
# vocabulary. So roughly 110 terms compose almost every name in the application, and
# a term translated once is translated consistently everywhere it appears.
#
# Why it matters more than convenience. A01 and A05 are the same company and the same
# business. If A05 calls `商品コード` anything other than `product_cd`, the two systems
# cannot be integrated later without a mapping nobody wrote down. Consistency across
# the programme is the point; automation is a side effect.
#
# `provenance` is per term and is not decoration:
#
#   A01       This term's English name is already decided in
#             `A01_Table_Definitions.md`, a dated document with a named author. It is
#             precedent, and a later project must not spell it differently.
#   analysis  Proposed by this analysis. It is a translation, not evidence. Nothing
#             downstream may treat it as decided until a person accepts it - which is
#             what `input/decisions/glossary.yaml` records.
#
# A composed name is only ever as good as its terms, so `$ak glossary` reports which
# terms produced each name and whether the name was covered completely. A name that
# is not fully covered is published as a partial proposal, never as a finished name.
version: 1

provenance:
  A01: >-
    Aligned with A01_Table_Definitions.md (Conversion Table, version 0.1). Decided by
    a person; treat as precedent binding on later projects.
  analysis: >-
    Proposed by this analysis from the Japanese. Needs a human to accept it before
    anything downstream relies on it.

# Longest match wins, left to right, joined with `_`. A trailing index is stripped
# before matching and re-appended, so `数量12` composes as `quantity_12`.
composition:
  join: "_"
  index_suffix: "_{n}"
  case: lower_snake
  # Japanese word order is kept, not rearranged into idiomatic English.
  # `酒アイテム別確認表` becomes `liquor_item_by_confirmation_report`, not
  # `liquor_confirmation_report_by_item`. Reordering reads better and breaks the one
  # property that makes these names safe: a composed name maps back to exactly one
  # production name, term for term, in order. For a migration mapping that
  # reversibility is worth more than fluency.
  word_order: source

