version: "2.2"
app:
  id: "DEMO"
  name_en: "Synthetic Order Demo"
  name_ja: ""
  name_vi: ""
project:
  classification:
    topology: "client_server"
    frontend_format: "exported"
    source_availability: "exported_only"
    backend_kinds: ["sql_server"]
artifacts:
  - id: "DEMO_VBA_FORM"
    kind: "source_export"
    role: "frontend"
    format: "vba"
    acquisition: "imported"
    required: true
    source_ref:
      type: "workspace_path"
      value: "sources/vba/DemoOrderForm.bas"
  - id: "DEMO_SQL_SCHEMA"
    kind: "sql_server_schema"
    role: "backend"
    format: "sql"
    backend_kind: "sql_server"
    acquisition: "imported"
    required: true
    source_ref:
      type: "workspace_path"
      value: "sources/sql/demo_orders.sql"
  - id: "DEMO_SQL_CATALOG"
    kind: "sql_server_catalog"
    role: "backend"
    format: "json"
    backend_kind: "sql_server"
    acquisition: "imported"
    required: true
    source_ref:
      type: "workspace_path"
      value: "sources/sql/catalog.json"
scope:
  legacy_only: true
  current_implementation: "excluded"
  notes: "Synthetic public example only."
analysis:
  source_policy:
    ignore_file: ".investigationignore"
    include_patterns: []
    ignore_patterns: []
  build_context:
    compilation_databases: []
    compile_flags: []
    projects: []
    execute_commands: false
  module_planning:
    enabled: true
    strategy: "hierarchical_leaf_first"
    incremental_refresh: true
shared_context:
  global_sms_graph: ""
  shared_decisions: []
outputs:
  root: "outputs"
  languages: ["EN"]
  presentation_template: ""
  derived:
    e2e_html: false
    boundary_html: false
    presentation_pptx: false
multi_agent:
  enabled: true
  preferred_runtime: "generic"
  max_parallel: 2
  coordinator_only_merge: true
  independent_qa: true
  evidence_collection_parallel: true
  phase_publication_sequential: true
  conflict_policy: "record_and_escalate"
  human_checkpoints: ["inventory", "context_extraction", "module_plan", "phase1_phase2", "phase3", "phase4_phase5", "phase6", "qa"]
